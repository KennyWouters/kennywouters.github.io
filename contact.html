<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Kenny Wouters</title>
  <meta name="description" content="Contacter Kenny Wouters par email.">
  <link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
  <header>
    <div class="container">
      <a class="brand" href="index.html">Kenny Wouters</a>
      <nav>
        <ul>
          <li><a href="index.html">Accueil</a></li>
          <li><a href="cv.html">CV</a></li>
          <li><a href="projets.html">Projets</a></li>
          <li><a href="documents.html">Documents</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1 class="page-title">Contact</h1>
      <p class="lead">Une opportunité, une question ? Laissez-moi un message, je vous réponds rapidement.</p>

      <div id="sent" class="notice hidden" role="status">
        Merci, votre message a bien été envoyé. Je reviens vers vous au plus vite.
      </div>

      <!-- Envoi via FormSubmit (https://formsubmit.co) : aucun serveur nécessaire. -->
      <form action="https://formsubmit.co/kenny.wouters2@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="Nouveau message depuis le site">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" id="next">
        <input type="text" name="_honey" class="hidden" tabindex="-1" autocomplete="off">

        <label>Nom
          <input type="text" name="nom" required autocomplete="name">
        </label>
        <label>Email
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label>Sujet
          <input type="text" name="sujet" required>
        </label>
        <label>Message
          <textarea name="message" required></textarea>
        </label>
        <div><button class="btn" type="submit">Envoyer</button></div>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">© <span id="year"></span> Kenny Wouters · Liège, Belgique</div>
  </footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    // Retour sur cette page après l'envoi, avec un message de confirmation.
    document.getElementById("next").value = location.href.split("?")[0] + "?envoye=1";
    if (new URLSearchParams(location.search).has("envoye")) {
      document.getElementById("sent").classList.remove("hidden");
    }
  </script>
</body>
</html>
